<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal AR</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
#app { width:100vw; height:100dvh; position:relative; }

/* ── Landing ── */
#screen-landing {
  position:absolute; inset:0; z-index:10;
  background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; padding:24px;
}
.landing-title { font-size:3rem; font-weight:900; letter-spacing:-2px; }
.landing-title span { color:#4ade80; }
.landing-sub { color:#94a3b8; font-size:0.95rem; margin:8px 0 40px; text-align:center; line-height:1.6; }
.cards { display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px; }
.card {
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:18px 20px; cursor:pointer; display:flex; align-items:center; gap:14px;
  transition:all .18s;
}
.card:active { transform:scale(.97); background:rgba(255,255,255,0.12); }
.card.highlight { border-color:#4ade80; background:rgba(74,222,128,.1); }
.card-icon { font-size:2rem; width:44px; text-align:center; }
.card-title { font-size:1rem; font-weight:700; }
.card-desc { font-size:0.75rem; color:#94a3b8; margin-top:2px; }
.chip { margin-left:auto; background:#4ade80; color:#000; font-size:.65rem; font-weight:700; padding:3px 9px; border-radius:100px; white-space:nowrap; }

/* ── AR Screen ── */
#screen-ar { position:absolute; inset:0; display:none; }
#screen-ar.on { display:block; }

/* MindAR injects <video> + <canvas> here */
#mindar-container { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; }

/* HUD */
#hud { position:absolute; inset:0; z-index:10; pointer-events:none; }
#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:16px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
  display:flex; align-items:center; justify-content:space-between;
}
#btn-back {
  pointer-events:all; background:rgba(255,255,255,.15); border:none;
  border-radius:100px; color:#fff; font-size:.85rem; font-weight:600;
  padding:8px 16px; cursor:pointer; backdrop-filter:blur(8px);
}
#mode-chip { font-size:.75rem; color:#fff; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:100px; backdrop-filter:blur(8px); }

#vf {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-58%);
  width:220px; height:220px;
}
.corner {
  position:absolute; width:36px; height:36px;
  border:2.5px solid rgba(74,222,128,.6); transition:border-color .3s;
}
.corner.tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
.corner.tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
.corner.bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 4px; }
.corner.br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 4px 0; }
#vf.hit .corner { border-color:#4ade80; animation:pulse .8s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

#hint {
  position:absolute; bottom:0; left:0; right:0;
  padding:20px 20px calc(env(safe-area-inset-bottom,20px) + 60px);
  background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
  color:#fff; text-align:center;
}
#hint-main { font-size:.95rem; margin-bottom:4px; }
#hint-sub { font-size:.75rem; color:rgba(255,255,255,.55); }

#animal-card {
  position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 72px);
  left:50%; transform:translateX(-50%);
  background:rgba(10,10,10,.8); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.15); border-radius:20px;
  padding:14px 22px; min-width:190px; text-align:center; color:#fff;
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:10;
}
#animal-card.show { opacity:1; }
#ac-name { font-size:1.5rem; font-weight:800; }
#ac-sci { font-size:.72rem; color:rgba(255,255,255,.55); margin-top:2px; }
#ac-size { display:inline-block; margin-top:8px; background:#4ade80; color:#000; font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:100px; }

#loader {
  position:absolute; inset:0;
  background:rgba(0,0,0,.78);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; color:#fff; z-index:20;
}
#loader.gone { display:none; }
.spin { width:40px; height:40px; border:3px solid rgba(255,255,255,.2); border-top-color:#4ade80; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
#loader-cancel, #loader-reload {
  margin-top:8px; background:none; border:1px solid rgba(255,255,255,.3);
  color:rgba(255,255,255,.6); font-size:.8rem; padding:7px 24px;
  border-radius:100px; cursor:pointer;
}
#loader-cancel:active, #loader-reload:active { background:rgba(255,255,255,.1); }
#loader-reload { display:none; border-color:rgba(74,222,128,.5); color:#4ade80; }
#load-text { font-size:.88rem; color:rgba(255,255,255,.7); }

/* ── Markers Screen ── */
#screen-markers { position:absolute; inset:0; background:#f5f5f5; display:none; z-index:20; overflow-y:auto; }
#screen-markers.on { display:block; }
.mhdr { background:#111; color:#fff; padding:16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:1; }
.mhdr button { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }
.mhdr h2 { font-size:1rem; font-weight:700; }
.mgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
.mcard { background:#fff; border:2px solid #222; border-radius:12px; padding:12px 8px; text-align:center; }
.mcard-emoji { font-size:1.6rem; }
.mcard-name { font-size:.8rem; font-weight:700; color:#111; margin-top:4px; }
.mcard canvas { width:100% !important; max-width:110px; height:auto !important; margin:4px 0; }
#print-all { display:block; width:calc(100% - 32px); margin:0 16px 40px; background:#111; color:#fff; border:none; border-radius:12px; padding:16px; font-size:1rem; font-weight:700; cursor:pointer; }
@media print {
  #screen-markers .mhdr, #print-all { display:none; }
  #screen-markers { position:static; overflow:visible; }
  .mgrid { page-break-inside:avoid; }
}
</style>
</head>
<body>
<div id="app">

<!-- Landing -->
<div id="screen-landing">
  <div class="landing-title">Animal <span>AR</span></div>
  <p class="landing-sub">動物写真カードにカメラを向けると<br>実物大の3Dモデルが現れます</p>
  <div class="cards">
    <div class="card highlight" onclick="launchAR()">
      <div class="card-icon">📷</div>
      <div>
        <div class="card-title">ARスタート</div>
        <div class="card-desc">動物写真カードにカメラを向けてください<br>QRカードにも対応しています</div>
      </div>
      <span class="chip">スタート</span>
    </div>
    <div class="card" onclick="openMarkers()">
      <div class="card-icon">🖨</div>
      <div>
        <div class="card-title">QRカードを印刷</div>
        <div class="card-desc">マーカーカードを表示・印刷します</div>
      </div>
    </div>
  </div>
</div>

<!-- AR -->
<div id="screen-ar">
  <!-- MindAR が <video> + <canvas> をここに注入する -->
  <div id="mindar-container"></div>

  <div id="hud">
    <div id="topbar">
      <button id="btn-back" onclick="stopAR()">← 戻る</button>
      <span id="mode-chip">...</span>
    </div>
    <div id="vf">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
    <div id="hint"><div id="hint-main"></div><div id="hint-sub"></div></div>
  </div>

  <div id="animal-card">
    <div id="ac-name"></div>
    <div id="ac-sci"></div>
    <span id="ac-size"></span>
  </div>

  <div id="loader"><div class="spin"></div><p id="load-text">準備中...</p><button id="loader-cancel" onclick="stopAR()">キャンセル</button><button id="loader-reload" onclick="location.reload()">ページを再読み込み</button></div>
</div>

<!-- Markers -->
<div id="screen-markers">
  <div class="mhdr">
    <button onclick="closeMarkers()">✕</button>
    <h2>QRマーカーカード — 印刷してお使いください</h2>
  </div>
  <div class="mgrid" id="mgrid"></div>
  <button id="print-all" onclick="window.print()">🖨️ 印刷する</button>
</div>

</div>

<!-- MindAR v1.1.3 IIFE bundle served locally (Three.js bundled inside) -->
<script src="lib/mind-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ── イベント主催者向け設定 ────────────────────────────────────────
// index: MindARコンパイラにアップロードした順番（0始まり）
// key  : 動物キー (cat/dog/horse/sheep/cow/elephant/bear/zebra/giraffe/rabbit)
// scale: 3Dモデルの大きさ（A5印刷 約15cm幅を基準に調整、デフォルト0.3）
const TARGET_CONFIG = [
  { index: 0, key: 'wombat', scale: 0.3 },
  { index: 1, key: 'hippo',  scale: 0.3 },
];
const MIND_FILE = 'targets/animals.mind';

// ── Animal DB ──────────────────────────────────────────────────────
const DB = {
  wombat: { ja:'ウォンバット', sci:'Vombatus ursinus',          cm:40,  hex:0x8b6a4a, emoji:'🐨' },
  hippo:  { ja:'カバ',         sci:'Hippopotamus amphibius',    cm:150, hex:0x7a7068, emoji:'🦛' },
};

const QR_MAP = Object.fromEntries(
  Object.keys(DB).map(k => [`ANIMAL:${k.toUpperCase()}`, k])
);
const ANIMALS_LIST = [
  { key:'wombat', label:'ウォンバット', emoji:'🐨' },
  { key:'hippo',  label:'カバ',         emoji:'🦛' },
];

// THREE is provided by the MindAR bundle (window.MINDAR.IMAGE.THREE); assigned in launchAR()
let THREE = null;

// ── App State ──────────────────────────────────────────────────────
let mindarThree = null;
let mindarActive = false;
let qrOnlyMode = false;
let qrScanInterval = null;
let lastMindARDetect = 0;
let visibleKey = null;
let qrDetectedAt = 0;
let qrOnlyVideoEl = null;
let qrOnlyStream = null;
const anchorGroups = {};  // key → { group, anchor }
const QR_FALLBACK_DELAY = 2000; // ms: MindAR無反応後にQRスキャン開始

const $vf   = document.getElementById('vf');
const $card = document.getElementById('animal-card');
const $loader = document.getElementById('loader');

// ── Navigation ─────────────────────────────────────────────────────
function openMarkers() {
  document.getElementById('screen-markers').classList.add('on');
  buildMarkers();
}
function closeMarkers() {
  document.getElementById('screen-markers').classList.remove('on');
}

// ── AR Launch ──────────────────────────────────────────────────────
async function launchAR() {
  document.getElementById('screen-landing').style.display = 'none';
  document.getElementById('screen-ar').classList.add('on');
  $loader.classList.remove('gone');
  setText('load-text', 'カメラと追跡を初期化中...');
  setText('mode-chip', '画像追跡モード 🎯');
  setText('hint-main', '動物写真カードにカメラを向けてください');
  setText('hint-sub', 'QRカードにも対応しています');

  if (!window.MINDAR || !window.MINDAR.IMAGE) {
    setText('load-text', 'ARライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
    document.getElementById('loader-reload').style.display = '';
    return;
  }
  THREE = window.MINDAR.IMAGE.THREE;

  await initMindAR();

  $loader.classList.add('gone');
}

// ── MindAR Init ────────────────────────────────────────────────────
async function initMindAR() {
  // targets.mind が存在するか確認
  setText('load-text', '画像ターゲットを確認中...');
  let mindFileOk = false;
  try {
    const resp = await fetch(MIND_FILE, { method: 'HEAD' });
    mindFileOk = resp.ok;
  } catch (_) {
    mindFileOk = false;
  }

  if (!mindFileOk) {
    // graceful fallback: QRスキャンのみモード
    qrOnlyMode = true;
    setText('mode-chip', 'QRコードモード ▣');
    setText('hint-main', 'QRマーカーカードにカメラを向けてください');
    setText('hint-sub', '画像ターゲットファイル未設定 — QRモードで動作中');
    await startQROnlyCamera();
    return;
  }

  // MindARThree インスタンス生成
  setText('load-text', 'トラッキングエンジンを準備中...');
  let instance;
  try {
    instance = new window.MINDAR.IMAGE.MindARThree({
      container: document.querySelector('#mindar-container'),
      imageTargetSrc: MIND_FILE,
      maxTrack: 1,
      uiLoading: 'no',
      uiScanning: 'no',
      uiError: 'no',
    });
  } catch (e) {
    setText('load-text', 'エンジンの初期化に失敗しました。キャンセルして再試行してください。');
    return; // cancel button lets user go back
  }
  mindarThree = instance;

  const { renderer, scene, camera } = mindarThree;

  // ライティング（MindARのsceneに追加）
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(3, 5, 4);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
  fill.position.set(-2, 0, 2);
  scene.add(fill);

  // 全アニマルをanchorにpre-attach（addAnchor は start() より前に呼ぶ）
  for (const cfg of TARGET_CONFIG) {
    if (!DB[cfg.key]) continue;

    const anchor = mindarThree.addAnchor(cfg.index);
    const group = buildAnimal(cfg.key);

    group.scale.setScalar(cfg.scale ?? 0.3);
    group.position.y = 0.1; // カード面より少し上
    group.visible = false;

    anchor.group.add(group);
    anchorGroups[cfg.key] = { group, anchor };

    // クロージャ用にキャプチャ
    const key = cfg.key;

    anchor.onTargetFound = () => {
      group.visible = true;
      lastMindARDetect = Date.now();
      stopQRFallback();
      showAnimalCard(key);
      $vf.classList.add('hit');
      visibleKey = key;
      // bounce-in
      let t = 0;
      const savedY = group.position.y;
      group.position.y = savedY - 0.4;
      const bounce = setInterval(() => {
        t = Math.min(t + 0.08, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        group.position.y = savedY - 0.4 * (1 - ease);
        if (t >= 1) { group.position.y = savedY; clearInterval(bounce); }
      }, 16);
    };

    anchor.onTargetLost = () => {
      group.visible = false;
      $vf.classList.remove('hit');
      $card.classList.remove('show');
      visibleKey = null;
      scheduleQRFallback();
    };
  }

  // MindAR起動（カメラ + 追跡開始）
  setText('load-text', 'カメラを起動中...');
  try {
    const timeout = new Promise((_, rej) =>
      setTimeout(() => rej(new Error('timeout')), 30000)
    );
    await Promise.race([mindarThree.start(), timeout]);
  } catch (e) {
    if (e.message === 'timeout') {
      setText('load-text', 'カメラの起動がタイムアウトしました。キャンセルして再試行してください。');
    } else {
      setText('load-text', 'カメラを許可できませんでした。キャンセルして再試行してください。');
    }
    mindarThree = null;
    return; // cancel button lets user go back
  }

  mindarActive = true;

  // アニメーションループ
  renderer.setAnimationLoop(() => {
    for (const { group } of Object.values(anchorGroups)) {
      if (group.visible) group.rotation.y += 0.007;
    }
    renderer.render(scene, camera);
  });

  // QRフォールバック開始（MindAR検出中は一時停止される）
  scheduleQRFallback();
}

// ── AR Stop ───────────────────────────────────────────────────────
function stopAR() {
  stopQRFallback();

  if (mindarThree) {
    try {
      mindarThree.renderer.setAnimationLoop(null);
      mindarThree.stop();
    } catch (_) {}
    mindarThree = null;
  }

  if (qrOnlyMode) {
    stopQROnlyCamera();
    qrOnlyMode = false;
  }

  mindarActive = false;
  visibleKey = null;

  for (const k of Object.keys(anchorGroups)) delete anchorGroups[k];

  $card.classList.remove('show');
  $vf.classList.remove('hit');
  $loader.classList.add('gone');

  document.getElementById('screen-ar').classList.remove('on');
  document.getElementById('screen-landing').style.display = 'flex';
}

// ── Animal Card ────────────────────────────────────────────────────
function showAnimalCard(key) {
  const d = DB[key];
  setText('ac-name', `${d.emoji} ${d.ja}`);
  setText('ac-sci', d.sci);
  setText('ac-size', `実物大: ${d.cm}cm`);
  $card.classList.add('show');
}

// ── QR Fallback ────────────────────────────────────────────────────
function scheduleQRFallback() {
  if (qrScanInterval || qrOnlyMode) return;
  qrScanInterval = setInterval(runQRScan, 250);
}

function stopQRFallback() {
  clearInterval(qrScanInterval);
  qrScanInterval = null;
}

async function runQRScan() {
  // MindARが最近検出していたら待機
  if (Date.now() - lastMindARDetect < QR_FALLBACK_DELAY) return;

  const videoEl = qrOnlyMode
    ? qrOnlyVideoEl
    : (mindarThree && mindarThree.video);

  if (!videoEl || videoEl.readyState < 2) return;

  const tmp = document.createElement('canvas');
  tmp.width  = videoEl.videoWidth;
  tmp.height = videoEl.videoHeight;
  tmp.getContext('2d').drawImage(videoEl, 0, 0);
  const img = tmp.getContext('2d').getImageData(0, 0, tmp.width, tmp.height);
  const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });

  if (!code) {
    if (Date.now() - qrDetectedAt > 3000 && visibleKey) {
      $vf.classList.remove('hit');
      $card.classList.remove('show');
      visibleKey = null;
    }
    return;
  }

  const key = QR_MAP[code.data.toUpperCase()];
  if (!key) return;

  qrDetectedAt = Date.now();

  if (key !== visibleKey) {
    visibleKey = key;
    $vf.classList.add('hit');
    showAnimalCard(key);
  }
}

// ── QR-Only Camera (graceful fallback) ────────────────────────────
async function startQROnlyCamera() {
  qrOnlyVideoEl = document.createElement('video');
  qrOnlyVideoEl.setAttribute('autoplay', '');
  qrOnlyVideoEl.setAttribute('playsinline', '');
  qrOnlyVideoEl.setAttribute('muted', '');
  qrOnlyVideoEl.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;';
  document.getElementById('mindar-container').appendChild(qrOnlyVideoEl);

  try {
    qrOnlyStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    qrOnlyVideoEl.srcObject = qrOnlyStream;
    await qrOnlyVideoEl.play();
  } catch (e) {
    alert('カメラを許可してください: ' + e.message);
    stopAR();
    return;
  }

  scheduleQRFallback();
}

function stopQROnlyCamera() {
  qrOnlyStream?.getTracks().forEach(t => t.stop());
  qrOnlyVideoEl?.remove();
  qrOnlyStream = null;
  qrOnlyVideoEl = null;
}

// ── Utility ───────────────────────────────────────────────────────
function setText(id, t) { document.getElementById(id).textContent = t; }

// ── 3D Animal Builders ────────────────────────────────────────────
function buildAnimal(key) {
  const g = new THREE.Group();
  const c = DB[key].hex;
  switch (key) {
    case 'wombat': makeWombat(g, c); break;
    case 'hippo':  makeHippo(g, c);  break;
    default: S(g, c, .7, .6, .7, 0, 0, 0);
  }
  return g;
}

// ── Geometry Helpers ──────────────────────────────────────────────
const mk = (geo, color, rough = 0.72) => {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0.05 }));
  m.castShadow = true; return m;
};
function S(g, c, sx, sy, sz, px, py, pz, rx = 0, ry = 0, rz = 0, rough = .72) {
  const m = mk(new THREE.SphereGeometry(1, 16, 12), c, rough);
  m.scale.set(sx, sy, sz); m.position.set(px, py, pz); m.rotation.set(rx, ry, rz);
  g.add(m); return m;
}
function C(g, c, rt, rb, h, px, py, pz, rx = 0, ry = 0, rz = 0) {
  const m = mk(new THREE.CylinderGeometry(rt, rb, h, 10), c);
  m.position.set(px, py, pz); m.rotation.set(rx, ry, rz); g.add(m);
}
function N(g, c, r, h, px, py, pz, rx = 0, ry = 0, rz = 0) {
  const m = mk(new THREE.ConeGeometry(r, h, 8), c);
  m.position.set(px, py, pz); m.rotation.set(rx, ry, rz); g.add(m);
}
function B(g, c, sx, sy, sz, px, py, pz, rx = 0, ry = 0, rz = 0) {
  const m = mk(new THREE.BoxGeometry(sx, sy, sz), c);
  m.position.set(px, py, pz); m.rotation.set(rx, ry, rz); g.add(m);
}
const dim = c => new THREE.Color(c).multiplyScalar(.6).getHex();

// ── Wombat ────────────────────────────────────────────────────────
function makeWombat(g, c) {
  const d = dim(c), belly = 0xc4a882;
  // compact barrel body, very low to ground
  S(g, c, 1.0, .55, .72, 0, 0, 0);

// ── QR Marker Cards ───────────────────────────────────────────────
function buildMarkers() {
  const grid = document.getElementById('mgrid');
  if (grid.children.length > 0) return;
  for (const a of ANIMALS_LIST) {
    const card = document.createElement('div');
    card.className = 'mcard';
    const emojiDiv = document.createElement('div');
    emojiDiv.className = 'mcard-emoji';
    emojiDiv.textContent = a.emoji;
    const qrDiv = document.createElement('div');
    qrDiv.style.cssText = 'margin:6px auto;max-width:120px;';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'mcard-name';
    nameDiv.textContent = a.label;
    card.append(emojiDiv, qrDiv, nameDiv);
    grid.appendChild(card);
    new QRCode(qrDiv, {
      text: `ANIMAL:${a.key.toUpperCase()}`,
      width: 120, height: 120,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  }
}
