<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Animal AR</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
#app { width:100vw; height:100dvh; position:relative; }

/* ── Landing ── */
#screen-landing {
  position:absolute; inset:0; z-index:10;
  background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; padding:24px;
}
.landing-title { font-size:3rem; font-weight:900; letter-spacing:-2px; }
.landing-title span { color:#4ade80; }
.landing-sub { color:#94a3b8; font-size:0.95rem; margin:8px 0 40px; text-align:center; }
.cards { display:flex; flex-direction:column; gap:14px; width:100%; max-width:380px; }
.card {
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:18px 20px; cursor:pointer; display:flex; align-items:center; gap:14px;
  transition:all .18s;
}
.card:active { transform:scale(.97); background:rgba(255,255,255,0.12); }
.card.highlight { border-color:#4ade80; background:rgba(74,222,128,.1); }
.card-icon { font-size:2rem; width:44px; text-align:center; }
.card-title { font-size:1rem; font-weight:700; }
.card-desc { font-size:0.75rem; color:#94a3b8; margin-top:2px; }
.chip { margin-left:auto; background:#4ade80; color:#000; font-size:.65rem; font-weight:700; padding:3px 9px; border-radius:100px; white-space:nowrap; }

/* ── AR Screen ── */
#screen-ar { position:absolute; inset:0; display:none; }
#screen-ar.on { display:block; }
#video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
#canvas-3d, #canvas-det { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#canvas-3d { z-index:2; }
#canvas-det { z-index:3; }

/* HUD */
#hud { position:absolute; inset:0; z-index:4; pointer-events:none; }
#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:env(safe-area-inset-top,20px) 16px 16px;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
  display:flex; align-items:center; justify-content:space-between;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);
}
#btn-back {
  pointer-events:all; background:rgba(255,255,255,.15); border:none;
  border-radius:100px; color:#fff; font-size:.85rem; font-weight:600;
  padding:8px 16px; cursor:pointer; backdrop-filter:blur(8px);
}
#mode-chip { font-size:.75rem; color:#fff; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:100px; backdrop-filter:blur(8px); }

/* Viewfinder */
#vf {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-58%);
  width:220px; height:220px; pointer-events:none;
}
.corner {
  position:absolute; width:36px; height:36px;
  border:2.5px solid rgba(74,222,128,.6); transition:border-color .3s;
}
.corner.tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:4px 0 0 0; }
.corner.tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 4px 0 0; }
.corner.bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 4px; }
.corner.br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 4px 0; }
#vf.hit .corner { border-color:#4ade80; animation:pulse .8s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

#hint {
  position:absolute; bottom:0; left:0; right:0;
  padding:20px 20px calc(env(safe-area-inset-bottom,20px) + 60px);
  background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
  color:#fff; text-align:center;
}
#hint-main { font-size:.95rem; margin-bottom:4px; }
#hint-sub { font-size:.75rem; color:rgba(255,255,255,.55); }

#animal-card {
  position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 72px); left:50%; transform:translateX(-50%);
  background:rgba(10,10,10,.8); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.15); border-radius:20px;
  padding:14px 22px; min-width:190px; text-align:center; color:#fff;
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:5;
}
#animal-card.show { opacity:1; }
#ac-name { font-size:1.5rem; font-weight:800; }
#ac-sci { font-size:.72rem; color:rgba(255,255,255,.55); margin-top:2px; }
#ac-size { display:inline-block; margin-top:8px; background:#4ade80; color:#000; font-size:.7rem; font-weight:700; padding:3px 10px; border-radius:100px; }

#loader {
  position:absolute; inset:0; background:rgba(0,0,0,.78);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; color:#fff; z-index:6;
}
#loader.gone { display:none; }
.spin { width:40px; height:40px; border:3px solid rgba(255,255,255,.2); border-top-color:#4ade80; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
#load-text { font-size:.88rem; color:rgba(255,255,255,.7); }

/* ── Markers Screen ── */
#screen-markers { position:absolute; inset:0; background:#f5f5f5; display:none; z-index:20; overflow-y:auto; }
#screen-markers.on { display:block; }
.mhdr { background:#111; color:#fff; padding:16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; }
.mhdr button { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }
.mhdr h2 { font-size:1rem; font-weight:700; }
.mgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
.mcard { background:#fff; border:2px solid #222; border-radius:12px; padding:12px 8px; text-align:center; }
.mcard-emoji { font-size:1.6rem; }
.mcard-name { font-size:.8rem; font-weight:700; color:#111; margin-top:4px; }
.mcard canvas { width:100% !important; max-width:110px; height:auto !important; margin:4px 0; }
#print-all { display:block; width:calc(100% - 32px); margin:0 16px 40px; background:#111; color:#fff; border:none; border-radius:12px; padding:16px; font-size:1rem; font-weight:700; cursor:pointer; }
@media print {
  #screen-markers .mhdr, #print-all { display:none; }
  #screen-markers { position:static; overflow:visible; }
  .mgrid { page-break-inside:avoid; }
}
</style>
</head>
<body>
<div id="app">

<!-- Landing -->
<div id="screen-landing">
  <div class="landing-title">Animal <span>AR</span></div>
  <p class="landing-sub">カメラで動物を写すと実物大3Dが現れます</p>
  <div class="cards">
    <div class="card highlight" onclick="launchAR('detect')">
      <div class="card-icon">📷</div>
      <div>
        <div class="card-title">動物・写真・フィギュアを写す</div>
        <div class="card-desc">AIがネコ・イヌ・ゾウ etc. を自動認識</div>
      </div>
      <span class="chip">推奨</span>
    </div>
    <div class="card" onclick="launchAR('qr')">
      <div class="card-icon">▣</div>
      <div>
        <div class="card-title">QRマーカーを写す</div>
        <div class="card-desc">専用カードをかざすと3D表示</div>
      </div>
    </div>
    <div class="card" onclick="openMarkers()">
      <div class="card-icon">🖨</div>
      <div>
        <div class="card-title">QRカードを印刷</div>
        <div class="card-desc">マーカーカードを表示・印刷します</div>
      </div>
    </div>
  </div>
</div>

<!-- AR -->
<div id="screen-ar">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-det"></canvas>
  <canvas id="canvas-3d"></canvas>
  <div id="hud">
    <div id="topbar">
      <button id="btn-back" onclick="stopAR()">← 戻る</button>
      <span id="mode-chip">...</span>
    </div>
    <div id="vf">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
    </div>
    <div id="hint"><div id="hint-main"></div><div id="hint-sub"></div></div>
  </div>
  <div id="animal-card">
    <div id="ac-name"></div>
    <div id="ac-sci"></div>
    <span id="ac-size"></span>
  </div>
  <div id="loader"><div class="spin"></div><p id="load-text">準備中...</p></div>
</div>

<!-- Markers -->
<div id="screen-markers">
  <div class="mhdr">
    <button onclick="closeMarkers()">✕</button>
    <h2>QRマーカーカード — 印刷してお使いください</h2>
  </div>
  <div class="mgrid" id="mgrid"></div>
  <button id="print-all" onclick="window.print()">🖨️ 印刷する</button>
</div>

</div>

<!-- Dependencies -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ── Animal DB ─────────────────────────────────────────────────────────
const DB = {
  cat:      { ja:'ネコ',     sci:'Felis catus',              cm:25,  hex:0xe8b87a, emoji:'🐱' },
  dog:      { ja:'イヌ',     sci:'Canis lupus familiaris',   cm:50,  hex:0xb5651d, emoji:'🐶' },
  horse:    { ja:'ウマ',     sci:'Equus ferus caballus',     cm:160, hex:0x8b7355, emoji:'🐴' },
  sheep:    { ja:'ヒツジ',   sci:'Ovis aries',               cm:70,  hex:0xf0f0f0, emoji:'🐑' },
  cow:      { ja:'ウシ',     sci:'Bos taurus',               cm:140, hex:0xf5deb3, emoji:'🐄' },
  elephant: { ja:'ゾウ',     sci:'Loxodonta africana',       cm:300, hex:0x808080, emoji:'🐘' },
  bear:     { ja:'クマ',     sci:'Ursus arctos',             cm:150, hex:0x4a3728, emoji:'🐻' },
  zebra:    { ja:'シマウマ', sci:'Equus quagga',             cm:140, hex:0x222222, emoji:'🦓' },
  giraffe:  { ja:'キリン',   sci:'Giraffa camelopardalis',   cm:500, hex:0xe8c96a, emoji:'🦒' },
  rabbit:   { ja:'ウサギ',   sci:'Oryctolagus cuniculus',    cm:20,  hex:0xfafafa, emoji:'🐰' },
};

const COCO = { cat:'cat', dog:'dog', horse:'horse', sheep:'sheep', cow:'cow', elephant:'elephant', bear:'bear', zebra:'zebra', giraffe:'giraffe' };
const QR_MAP = Object.fromEntries(Object.keys(DB).map(k => [`ANIMAL:${k.toUpperCase()}`, k]));

// ── App State ──────────────────────────────────────────────────────────
let mode = null, cocoModel = null, stream = null, raf = null;
let renderer, scene, camera, mesh3d;
let detected = null, detectedAt = 0, rotation = 0, frameN = 0;

const $video    = document.getElementById('video');
const $canvas3d = document.getElementById('canvas-3d');
const $canvasDet= document.getElementById('canvas-det');
const $vf       = document.getElementById('vf');
const $card     = document.getElementById('animal-card');
const $loader   = document.getElementById('loader');

// ── Navigation ─────────────────────────────────────────────────────────
function openMarkers() {
  document.getElementById('screen-markers').classList.add('on');
  buildMarkers();
}
function closeMarkers() {
  document.getElementById('screen-markers').classList.remove('on');
}

async function launchAR(m) {
  mode = m;
  document.getElementById('screen-landing').style.display = 'none';
  document.getElementById('screen-ar').classList.add('on');
  $loader.classList.remove('gone');

  setText('load-text', 'カメラを起動中...');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
    $video.srcObject = stream;
    await $video.play();
  } catch(e) {
    alert('カメラを許可してください: ' + e.message);
    stopAR(); return;
  }

  initThree();

  if (m === 'detect') {
    setText('load-text', 'AIモデルを読み込み中... (初回は数秒かかります)');
    setText('mode-chip', '動物検出モード 🐾');
    setText('hint-main', 'フィギュア・写真・実物をカメラに向けてください');
    setText('hint-sub', '対応: ネコ イヌ ウマ ヒツジ ウシ ゾウ クマ シマウマ キリン');
    if (!cocoModel) cocoModel = await cocoSsd.load();
  } else {
    setText('mode-chip', 'QRコードモード ▣');
    setText('hint-main', 'QRマーカーカードをカメラに向けてください');
    setText('hint-sub', '「QRカードを印刷」でカードを用意できます');
  }

  $loader.classList.add('gone');
  frameN = 0;
  loop();
}

function stopAR() {
  if (raf) cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t => t.stop());
  renderer?.dispose();
  stream = raf = renderer = scene = camera = mesh3d = null;
  detected = null;
  $card.classList.remove('show');
  $vf.classList.remove('hit');
  document.getElementById('screen-ar').classList.remove('on');
  document.getElementById('screen-landing').style.display = 'flex';
}

function setText(id, t) { document.getElementById(id).textContent = t; }

// ── Three.js ───────────────────────────────────────────────────────────
function initThree() {
  const w = window.innerWidth, h = window.innerHeight;
  $canvas3d.width = w * devicePixelRatio; $canvas3d.height = h * devicePixelRatio;
  $canvas3d.style.width = w + 'px'; $canvas3d.style.height = h + 'px';

  renderer = new THREE.WebGLRenderer({ canvas:$canvas3d, alpha:true, antialias:true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(w, h);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, w/h, 0.001, 500);
  camera.position.set(0, 0, 4);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(3, 5, 4);
  scene.add(sun);
  scene.add(Object.assign(new THREE.DirectionalLight(0x88aaff, 0.3), {position:{x:-2,y:0,z:2}}));

  window.onresize = () => {
    if (!renderer) return;
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h; camera.updateProjectionMatrix();
    $canvasDet.width = w; $canvasDet.height = h;
  };
}

// ── Main Loop ──────────────────────────────────────────────────────────
async function loop() {
  if (!renderer) return;
  raf = requestAnimationFrame(loop);
  frameN++;

  if (mesh3d) { mesh3d.rotation.y = rotation += 0.007; }
  renderer.render(scene, camera);

  if ($video.readyState < 2 || frameN % 20 !== 0) return;

  if (mode === 'detect') await detectAnimals();
  else await detectQR();
}

// ── COCO-SSD Detection ─────────────────────────────────────────────────
async function detectAnimals() {
  if (!cocoModel) return;
  let preds;
  try { preds = await cocoModel.detect($video); } catch { return; }

  const ctx = $canvasDet.getContext('2d');
  const cw = $canvasDet.width = window.innerWidth;
  const ch = $canvasDet.height = window.innerHeight;
  ctx.clearRect(0, 0, cw, ch);

  const sx = cw / $video.videoWidth, sy = ch / $video.videoHeight;
  let best = null, bestScore = 0;

  for (const p of preds) {
    const key = COCO[p.class];
    if (!key || p.score < 0.3) continue;
    const [bx, by, bw, bh] = p.bbox;
    const x=bx*sx, y=by*sy, w=bw*sx, h=bh*sy;

    // Draw box
    ctx.strokeStyle = 'rgba(74,222,128,.85)';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);
    // Label
    const label = `${DB[key].emoji} ${DB[key].ja} ${Math.round(p.score*100)}%`;
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(x, y-26, ctx.measureText(label).width + 12, 26);
    ctx.fillStyle = '#000'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(label, x+6, y-7);

    if (p.score > bestScore) { bestScore = p.score; best = key; }
  }

  if (best) showAnimal(best);
  else clearAnimal();
}

// ── QR Detection ───────────────────────────────────────────────────────
async function detectQR() {
  const tmp = document.createElement('canvas');
  tmp.width = $video.videoWidth; tmp.height = $video.videoHeight;
  tmp.getContext('2d').drawImage($video, 0, 0);
  const img = tmp.getContext('2d').getImageData(0, 0, tmp.width, tmp.height);
  const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});

  const ctx = $canvasDet.getContext('2d');
  $canvasDet.width = window.innerWidth; $canvasDet.height = window.innerHeight;
  ctx.clearRect(0, 0, $canvasDet.width, $canvasDet.height);

  if (!code) { clearAnimal(); return; }

  const key = QR_MAP[code.data.toUpperCase()];
  if (!key) { clearAnimal(); return; }

  // Draw QR outline
  const sx = $canvasDet.width / $video.videoWidth, sy = $canvasDet.height / $video.videoHeight;
  const pts = [code.location.topLeftCorner, code.location.topRightCorner,
               code.location.bottomRightCorner, code.location.bottomLeftCorner];
  ctx.beginPath();
  ctx.moveTo(pts[0].x*sx, pts[0].y*sy);
  pts.slice(1).forEach(p => ctx.lineTo(p.x*sx, p.y*sy));
  ctx.closePath();
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(74,222,128,.12)'; ctx.fill();

  showAnimal(key);
}

// ── Animal Show/Hide ───────────────────────────────────────────────────
function showAnimal(key) {
  detectedAt = Date.now();
  $vf.classList.add('hit');
  if (key === detected) return;
  detected = key;
  spawnModel(key);
  const d = DB[key];
  setText('ac-name', `${d.emoji} ${d.ja}`);
  setText('ac-sci', d.sci);
  setText('ac-size', `実物大: ${d.cm}cm`);
  $card.classList.add('show');
}

function clearAnimal() {
  if (Date.now() - detectedAt > 2000) $vf.classList.remove('hit');
  if (Date.now() - detectedAt > 3000) { $card.classList.remove('show'); detected = null; }
}

// ── 3D Model ───────────────────────────────────────────────────────────
function spawnModel(key) {
  if (mesh3d) { scene.remove(mesh3d); mesh3d = null; }
  const grp = buildAnimal(key);
  // Scale so animal fills ~1.6 units of screen height
  // Real height in scene units (1 unit ≈ 25cm)
  const d = DB[key];
  const realUnits = d.cm / 25;
  grp.scale.setScalar(1.6 / realUnits);

  grp.position.y = -2;
  scene.add(grp);
  mesh3d = grp;
  // Bounce in
  let t = 0;
  const bounce = setInterval(() => {
    if (!mesh3d || mesh3d !== grp) { clearInterval(bounce); return; }
    t = Math.min(t + 0.08, 1);
    const ease = 1 - Math.pow(1-t,3);
    grp.position.y = -0.8 + (-2+0.8) * (1-ease);
    if (t >= 1) clearInterval(bounce);
  }, 16);
}

// ── Geometry Helpers ───────────────────────────────────────────────────
const mk = (geo, color, rough=0.72) => {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:rough, metalness:0.05}));
  m.castShadow = true; return m;
};
const sp = (rx,ry,rz,c,r) => Object.assign(mk(new THREE.SphereGeometry(1,16,12),c,r||.72), {scale:{x:rx,y:ry,z:rz}});
const cy = (rt,rb,h,c) => mk(new THREE.CylinderGeometry(rt,rb,h,10),c);
const cn = (r,h,c) => mk(new THREE.ConeGeometry(r,h,8),c);
const bx = (sx,sy,sz,c) => mk(new THREE.BoxGeometry(sx,sy,sz),c);

function place(obj, px,py,pz, rx=0,ry=0,rz=0) {
  obj.position.set(px,py,pz);
  obj.rotation.set(rx,ry,rz);
  return obj;
}

function addTo(g, geo, c, px,py,pz, sx=1,sy=1,sz=1, rx=0,ry=0,rz=0) {
  const m = mk(geo, c);
  m.position.set(px,py,pz); m.scale.set(sx,sy,sz); m.rotation.set(rx,ry,rz);
  g.add(m);
}

function S(g,c, sx,sy,sz, px,py,pz, rx=0,ry=0,rz=0, rough=.72) {
  const m = mk(new THREE.SphereGeometry(1,16,12), c, rough);
  m.scale.set(sx,sy,sz); m.position.set(px,py,pz); m.rotation.set(rx,ry,rz);
  g.add(m); return m;
}
function C(g,c, rt,rb,h, px,py,pz, rx=0,ry=0,rz=0) {
  const m = mk(new THREE.CylinderGeometry(rt,rb,h,10), c);
  m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); g.add(m);
}
function N(g,c, r,h, px,py,pz, rx=0,ry=0,rz=0) {
  const m = mk(new THREE.ConeGeometry(r,h,8), c);
  m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); g.add(m);
}
function B(g,c, sx,sy,sz, px,py,pz, rx=0,ry=0,rz=0) {
  const m = mk(new THREE.BoxGeometry(sx,sy,sz), c);
  m.position.set(px,py,pz); m.rotation.set(rx,ry,rz); g.add(m);
}

const dim = c => new THREE.Color(c).multiplyScalar(.6).getHex();

// ── Animal Builders ────────────────────────────────────────────────────
function buildAnimal(key) {
  const g = new THREE.Group();
  const c = DB[key].hex;
  switch(key) {
    case 'cat':      makeCat(g,c); break;
    case 'dog':      makeDog(g,c); break;
    case 'horse':    makeHorse(g,c); break;
